<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="16" viewBox="0 0 1100 16" role="img" aria-label="Decorative gradient divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="80%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="7" width="1020" height="2" rx="1" fill="url(#line)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
