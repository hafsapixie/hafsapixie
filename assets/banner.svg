<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Hafsa Naseer, Frontend Developer. Tech: HTML, CSS, Tailwind CSS, JavaScript, Python, Django, Azure.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#121A33"/>
      <stop offset="100%" stop-color="#0E1F2C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name { font-family: Segoe UI, Helvetica Neue, Arial, sans-serif; font-size: 46px; font-weight: 700; fill: #F8FAFC; }
      .title { font-family: Segoe UI, Helvetica Neue, Arial, sans-serif; font-size: 20px; fill: #C4B5FD; }
      .chip { font-family: Segoe UI, Helvetica Neue, Arial, sans-serif; font-size: 13px; fill: #E2E8F0; }
      .bar { fill: url(#accent); }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.85; }
      }
      .fade { animation: rise 0.9s ease-out both; }
      .fade2 { animation: rise 0.9s ease-out 0.15s both; }
      .fade3 { animation: rise 0.9s ease-out 0.3s both; }
      .orb { animation: pulse 6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1100" height="340" rx="20" fill="url(#bg)"/>
  <rect class="orb" width="1100" height="340" rx="20" fill="url(#glow1)"/>
  <rect class="orb" width="1100" height="340" rx="20" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1100" height="4" rx="2" class="bar"/>

  <g class="fade">
    <text class="name" x="56" y="120">Hafsa Naseer</text>
  </g>
  <g class="fade2">
    <text class="title" x="56" y="162">Frontend Developer · Learning Full Stack Development</text>
  </g>

  <g class="fade3">
    <rect x="56" y="210" width="78" height="34" rx="17" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text class="chip" x="95" y="232" text-anchor="middle">HTML</text>

    <rect x="146" y="210" width="70" height="34" rx="17" fill="#1E293B" stroke="#60A5FA" stroke-width="1"/>
    <text class="chip" x="181" y="232" text-anchor="middle">CSS</text>

    <rect x="228" y="210" width="128" height="34" rx="17" fill="#1E293B" stroke="#14B8A6" stroke-width="1"/>
    <text class="chip" x="292" y="232" text-anchor="middle">Tailwind CSS</text>

    <rect x="368" y="210" width="112" height="34" rx="17" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
    <text class="chip" x="424" y="232" text-anchor="middle">JavaScript</text>

    <rect x="492" y="210" width="90" height="34" rx="17" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text class="chip" x="537" y="232" text-anchor="middle">Python</text>

    <rect x="594" y="210" width="90" height="34" rx="17" fill="#1E293B" stroke="#A78BFA" stroke-width="1"/>
    <text class="chip" x="639" y="232" text-anchor="middle">Django</text>

    <rect x="696" y="210" width="80" height="34" rx="17" fill="#1E293B" stroke="#14B8A6" stroke-width="1"/>
    <text class="chip" x="736" y="232" text-anchor="middle">Azure</text>
  </g>

</svg>
