<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Hafsa Naseer, Frontend Developer. Tech: HTML, CSS, Tailwind CSS, JavaScript, Python, Django, Azure.">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#121A33"/>
      <stop offset="100%" stop-color="#0E1F2C"/>
    </linearGradient>
    <linearGradient id="bannerAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="bannerGlow1" cx="18%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bannerGlow2" cx="88%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="340" rx="20" fill="url(#bannerBg)"/>
  <rect width="1100" height="340" rx="20" fill="url(#bannerGlow1)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1100" height="340" rx="20" fill="url(#bannerGlow2)">
    <animate attributeName="opacity" values="1;0.65;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="1100" height="4" rx="2" fill="url(#bannerAccent)"/>

  <text x="56" y="120" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700">Hafsa Naseer</text>
  <text x="56" y="162" fill="#C4B5FD" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">Frontend Developer | Learning Full Stack Development</text>

  <rect x="56" y="210" width="78" height="34" rx="17" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="95" y="232" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">HTML</text>

  <rect x="146" y="210" width="70" height="34" rx="17" fill="#1E293B" stroke="#60A5FA" stroke-width="1"/>
  <text x="181" y="232" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">CSS</text>

  <rect x="228" y="210" width="128" height="34" rx="17" fill="#1E293B" stroke="#14B8A6" stroke-width="1"/>
  <text x="292" y="232" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Tailwind CSS</text>

  <rect x="368" y="210" width="112" height="34" rx="17" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="424" y="232" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">JavaScript</text>

  <rect x="492" y="210" width="90" height="34" rx="17" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="537" y="232" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Python</text>

  <rect x="594" y="210" width="90" height="34" rx="17" fill="#1E293B" stroke="#A78BFA" stroke-width="1"/>
  <text x="639" y="232" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Django</text>

  <rect x="696" y="210" width="80" height="34" rx="17" fill="#1E293B" stroke="#14B8A6" stroke-width="1"/>
  <text x="736" y="232" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Azure</text>
</svg>
