<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="180" viewBox="0 0 1100 180" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Highlights: 2 spoken languages, 4 frontend technologies, 2 backend technologies, Azure listed for cloud.">
  <defs>
    <linearGradient id="hlCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="hlStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <g>
    <rect x="8" y="18" width="250" height="144" rx="16" fill="url(#hlCard)" stroke="url(#hlStroke)" stroke-width="1.5"/>
    <text x="133" y="82" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700">2</text>
    <text x="133" y="112" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Spoken languages</text>
    <text x="133" y="134" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">English | Urdu</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="286" y="18" width="250" height="144" rx="16" fill="url(#hlCard)" stroke="url(#hlStroke)" stroke-width="1.5"/>
    <text x="411" y="82" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700">4</text>
    <text x="411" y="112" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Frontend technologies</text>
    <text x="411" y="134" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">HTML | CSS | Tailwind | JS</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="5s" begin="0.4s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="564" y="18" width="250" height="144" rx="16" fill="url(#hlCard)" stroke="url(#hlStroke)" stroke-width="1.5"/>
    <text x="689" y="82" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700">2</text>
    <text x="689" y="112" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Backend technologies</text>
    <text x="689" y="134" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Python | Django</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="842" y="18" width="250" height="144" rx="16" fill="url(#hlCard)" stroke="url(#hlStroke)" stroke-width="1.5"/>
    <text x="967" y="82" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Azure</text>
    <text x="967" y="112" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Cloud platform</text>
    <text x="967" y="134" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">SQLite for data</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </g>
</svg>
